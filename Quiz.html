<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>Quiz</title>

  <link rel="stylesheet" href="css/Quiz.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Shippori+Mincho&family=Yusei+Magic&display=swap" rel="stylesheet">
</head>

<body>

  <!-- header -->
  <header>
    <div class="fixed-header flex fadeUp">

      <a href="" class="rogo">
        <span>Quiz</span>
      </a>

      <nav>
        <ul class="header_menu flex">
          <li><a href="#Q1">Q1</a></li>
          <li><a href="#Q2">Q2</a></li>
          <li><a href="#Q3">Q3</a></li>
        </ul>
      </nav>

    </div>
  </header>


  <main>

    <!-- ==================== Q1 ==================== -->

    <section id="Q1">
      <div class="container fadeUp">
        
        <h2>学祭用謎サイトテスト</h2>
        <h3>ルール・注意事項</h3>
        <p>*入力は半角で行ってください</p>
        <p>回答は何回でもできます</p>

        <h2>Q1</h2>
  
        <h3>1+1=?</h3>

        <input type="text" id="Answer1">

        <button onclick="checkAnswer1()">回答</button>

      </div>
    </section>

    <h3 class="container fadeUp" id="result1"></h3>


    <!-- ==================== Q2 ==================== -->

    <section id="Q2">
      <div class="container fadeUp">

        <h2>Q2</h2>

        <h3>1+2=?</h3>

        <input type="text" id="Answer2">

        <button onclick="checkAnswer2()">回答</button>

      </div>
    </section>

    <h3 class="container fadeUp" id="result2"></h3>


    <!-- ==================== Q3 ==================== -->

    <section id="Q3">
      <div class="container fadeUp">

        <h2>Q3</h2>

        <h3>1+3=?</h3>

        <input type="text" id="Answer3">

        <button onclick="checkAnswer3()">回答</button>

      </div>
    </section>

    <h3 class="container fadeUp" id="result3"></h3>


  </main>


  <!-- ==================== JavaScript ==================== -->

  <script>

    // Q1
    function checkAnswer1() {

      const answer1 = document.getElementById("Answer1").value;
      const result1 = document.getElementById("result1");

      if (answer1 === "2") {
        result1.textContent = "正解";
      } else {
        result1.textContent = "不正解";
      }

    }


    // Q2
    function checkAnswer2() {

      const answer2 = document.getElementById("Answer2").value;
      const result2 = document.getElementById("result2");

      if (answer2 === "3") {
        result2.textContent = "正解";
      } else {
        result2.textContent = "不正解";
      }

    }


    // Q3
    function checkAnswer3() {

      const answer3 = document.getElementById("Answer3").value;
      const result3 = document.getElementById("result3");

      if (answer3 === "4") {
        result3.textContent = "正解";
      } else {
        result3.textContent = "不正解";
      }

    }


    // ==================== スクロールアニメーション ====================

    const targets = document.querySelectorAll(".fadeUp");

    const observer = new IntersectionObserver((entries) => {

      entries.forEach(entry => {

        if (entry.isIntersecting) {

          entry.target.classList.add("show");

        } else {

          entry.target.classList.remove("show");

        }

      });

    }, {
      threshold: 0.2
    });


    targets.forEach(target => {
      observer.observe(target);
    });

  </script>

</body>

</html>
